plugins {
    id 'com.android.application'
}

android {
    namespace "com.kalimaktab.kitob"
    compileSdk 34

    defaultConfig {
        applicationId "com.kalimaktab.kitob"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Katta PDF faylni siqmasdan assets'da saqlash
    aaptOptions {
        noCompress "pdf"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
